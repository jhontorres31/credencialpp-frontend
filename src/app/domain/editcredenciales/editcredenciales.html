<div class="w-full max-w-6xl mx-auto p-4">

  <!-- Buscador por número de documento -->
  <div class="flex items-center mb-6">
    <input
      type="text"
      [(ngModel)]="numDocumentoBusqueda"
      (keyup.enter)="buscarTestigo()"
      class="w-80 h-10 bg-gray-100 rounded mr-2 px-4 text-center border border-gray-300"
      placeholder="Ingrese el número de documento"
    />
    <button
      type="button"
      (click)="buscarTestigo()"
      class="h-10 w-10 bg-gray-200 rounded hover:bg-gray-300 flex items-center justify-center">
      🔎
    </button>
  </div>

  @for (testigo of registrosEncontrados; track testigo.id_testigo) {

  <div class="mt-8 border-t-2 border-gray-300 pt-4">
      <p class="text-sm font-bold text-blue-700 mb-2">
        Credencial/Registro ID: {{ testigo.id_testigo }}
      </p>

      <form (ngSubmit)="guardarCambios(testigo)" class="grid grid-cols-3 gap-4">
        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Cod Departamento" name="cod_departamento_{{testigo.id_testigo}}" [(ngModel)]="testigo.cod_departamento">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Cod Municipio" name="cod_municipio_{{testigo.id_testigo}}" [(ngModel)]="testigo.cod_municipio">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Zona" name="zona_{{testigo.id_testigo}}" [(ngModel)]="testigo.zona">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Cod Puesto" name="cod_puesto_{{testigo.id_testigo}}" [(ngModel)]="testigo.cod_puesto">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Nombre Departamento" name="nom_departamento_{{testigo.id_testigo}}" [(ngModel)]="testigo.nom_departamento">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Nombre Municipio" name="nom_municipio_{{testigo.id_testigo}}" [(ngModel)]="testigo.nom_municipio">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Nombre Puesto" name="nom_puesto_{{testigo.id_testigo}}" [(ngModel)]="testigo.nom_puesto">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Mesa" name="mesa_{{testigo.id_testigo}}" [(ngModel)]="testigo.mesa">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Nombre de la Organización" name="organizacion_{{testigo.id_testigo}}" [(ngModel)]="testigo.organizacion">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Tipo de Testigo" name="tipo_testigo_{{testigo.id_testigo}}" [(ngModel)]="testigo.tipo_testigo">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="No Documento" name="num_documento_{{testigo.id_testigo}}" [(ngModel)]="testigo.num_documento">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Nombre" name="nombre_{{testigo.id_testigo}}" [(ngModel)]="testigo.nombre">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Segundo Nombre" name="segundo_nombre_{{testigo.id_testigo}}" [(ngModel)]="testigo.segundo_nombre">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Apellido" name="apellido_{{testigo.id_testigo}}" [(ngModel)]="testigo.apellido">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Segundo Apellido" name="segundo_apellido_{{testigo.id_testigo}}" [(ngModel)]="testigo.segundo_apellido">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Celular" name="celular_{{testigo.id_testigo}}" [(ngModel)]="testigo.celular">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Correo" name="correo_{{testigo.id_testigo}}" [(ngModel)]="testigo.correo">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Tipo Credencial" name="tipo_credencial_{{testigo.id_testigo}}" [(ngModel)]="testigo.tipo_credencial">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Resolución" name="resolucion_{{testigo.id_testigo}}" [(ngModel)]="testigo.resolucion">

        <input class="h-10 w-70 border-gray-600 border rounded-3xl text-center" type="text"
          placeholder="Comisión" name="comision_{{testigo.id_testigo}}" [(ngModel)]="testigo.comision">

          <div>
            <button class="bg-blue-600 rounded-2xl h-10 w-30 mt-10 text-white font-bold" type="submit">
          ✏️ Editar
        </button>
        <button type="button" (click)="eliminarTestigo(testigo.id_testigo)" class="bg-red-600 rounded-2xl h-10 w-30 mt-10 ml-5 text-white font-bold">
          🗑️ Eliminar
        </button>
          </div>

      </form>


    </div>
}
</div>
